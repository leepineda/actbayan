<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActBayan — Users</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body{
            margin:0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:#f4f6f8;
            color:#202124;
        }
        .container{
            padding:24px;
            max-width:1100px;
            margin:0 auto;
        }
        .header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:16px;
        }
        .header h1{
            font-size:18px;
            margin:0;
            font-weight:900;
        }
        table{
            width:100%;
            border-collapse:collapse;
            background:#fff;
            border:1px solid #e0e0e0;
            border-radius:14px;
            overflow:hidden;
        }
        thead th{
            text-align:left;
            font-size:12px;
            font-weight:900;
            text-transform:uppercase;
            color:#5f6368;
            background:#f1f3f4;
            padding:14px 16px;
            border-bottom:1px solid #e0e0e0;
        }
        tbody td{
            padding:14px 16px;
            border-bottom:1px solid #efefef;
            font-size:14px;
            vertical-align:middle;
        }
        tbody tr:last-child td{ border-bottom:none; }

        .actions{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .btn{
            border:none;
            border-radius:50px;
            padding:10px 14px;
            font-weight:900;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-size:12px;
        }
        .btn-danger{ background:#b91c1c; color:#fff; }
        .btn-danger:hover{ background:#8b0000; }
        .btn-warn{ background:#f59e0b; color:#111827; }
        .btn-warn:hover{ background:#d97706; }
        .muted{ color:#6b7280; font-size:12px; font-weight:700; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>User Accounts</h1>
        <div class="muted"><i class="fas fa-shield-halved" style="color:#8b0000;"></i> Admin tools</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>account_id</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% if users %}
                {% for u in users %}
                    <tr>
                        <td>{{ u.account_id }}</td>
                        <td>{{ u.first_name }} {{ u.last_name }}</td>
                        <td>
                            <div class="actions">
                                
                                    <button class="btn btn-danger" type="submit">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                               

                                
                                    <button class="btn btn-warn" type="submit">
                                       
                                    </button>
           
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3" class="muted">No users found.</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
</body>
</html>
