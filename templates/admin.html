<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActBayan — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --bg-main: #f4f6f8;
            --bg-nav-card: #ffffff;
            --text-main: #202124;
            --text-muted: #5f6368;
            --border-color: #e0e0e0;
            --icon-hover: #f1f3f4;
            --search-bg: #f1f3f4;
            --primary-red: #8b0000;
            --primary-red-hover: #a30000;
            --red-light: rgba(139,0,0,0.08);
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-nav-card: #1e1e1e;
            --text-main: #e8eaed;
            --text-muted: #9aa0a6;
            --border-color: #333333;
            --icon-hover: #2a2a2a;
            --search-bg: #2a2a2a;
            --red-light: rgba(139,0,0,0.15);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            overflow-x: hidden;
        }

        /* ===== SIDEBAR (ONLY) ===== */
        /* content container (starts after fixed sidebar) */
        .content-area {
            margin-left: 260px;
            padding: 0;
            width: calc(100% - 260px);
            min-height: 100vh;
            box-sizing: border-box;
        }

        .sidebar {
        position: fixed; left: 0; top: 0; max-height: 100vh; overflow: hidden;
            background-color: var(--bg-nav-card); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 24px 20px;
            z-index: 1000; transition: background-color 0.3s, border-color 0.3s;
        }
        .sidebar-logo {
            font-weight: 900; font-size: 26px; color: var(--text-main);
            text-decoration: none; margin-bottom: 30px; padding: 0 10px; display: block;
        }
        .sidebar-logo span { color: var(--primary-red); }

        .sidebar-search {
            display: flex; align-items: center; background-color: var(--search-bg);
            border-radius: 12px; padding: 10px 14px; gap: 8px; margin-bottom: 24px;
            border: 1.5px solid transparent; transition: border-color 0.2s;
        }
        .sidebar-search:focus-within { border-color: var(--primary-red); }
        .sidebar-search i { color: var(--text-muted); font-size: 13px; }
        .sidebar-search input {
            background: transparent; border: none; outline: none;
            font-size: 13px; color: var(--text-main); width: 100%; font-family: 'Inter';
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .sidebar-link {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px;
            border-radius: 12px; color: var(--text-muted); text-decoration: none;
            font-weight: 600; font-size: 14px; transition: all 0.2s;
        }
        .sidebar-link i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar-link:hover { background-color: var(--icon-hover); color: var(--primary-red); }
        .sidebar-link.active { background-color: var(--primary-red); color: white; }
        .notif-badge { background-color: #cc0000; color: white; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 50px; margin-left: auto; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .theme-toggle-btn {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted);
            cursor: pointer; font-weight: 600; font-size: 14px; background: transparent; border: none; font-family: 'Inter';
            width: 100%; text-align: left;
        }
        .theme-toggle-btn:hover { background-color: var(--icon-hover); color: var(--text-main); }

        .user-profile-btn { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-red), #c0392b); color: white; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .user-info { display: flex; flex-direction: column; overflow: hidden; }
        .user-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .user-role { font-size: 11px; color: var(--text-muted); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 70px; top: auto; bottom: 0; flex-direction: row; padding: 0; border-top: 1px solid var(--border-color); border-right: none; }
            .sidebar-logo, .sidebar-search, .sidebar-footer { display: none; }
            .sidebar-menu { flex-direction: row; justify-content: space-around; width: 100%; gap: 0; }
            .sidebar-link { flex-direction: column; gap: 4px; font-size: 10px; padding: 10px; border-radius: 0; width: 25%; justify-content: center; }
            .sidebar-link i { font-size: 20px; }
            .user-profile-btn { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="#" class="sidebar-logo">ActBayan<span>.</span></a>

    <div class="sidebar-search">
        <i class="fas fa-search"></i>
        <input type="text" id="sidebar-search-input" placeholder="Search...">
    </div>

    <nav class="sidebar-menu">
        <a href="#" class="sidebar-link active" onclick="loadPage('/activities')" return false;">
            <i class="fas fa-chart-line"></i> <span>User Activities</span>
        </a>
<a href="#" class="sidebar-link" onclick="loadPage('/users'); return false;">
            <i class="fas fa-users"></i> <span>User Accounts</span>
        </a>
        <a href="#" class="sidebar-link">
            <i class="fas fa-right-to-bracket"></i> <span>Login Attempts</span>
        </a>
        <a href="#" class="sidebar-link">
            <i class="fas fa-clipboard-list"></i> <span>Reports / Concerns</span>
        </a>
        <a href="#" class="sidebar-link">
            <i class="fas fa-gear"></i> <span>Admin Settings</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="theme-toggle-btn" id="theme-toggle-btn" type="button">
            <i class="fas fa-moon" id="theme-icon"></i> <span id="theme-label">Dark Mode</span>
        </button>

        <a href="{{ url_for('logout') }}" class="theme-toggle-btn" style="text-decoration:none;color:var(--text-muted); display:flex; align-items:center; gap:14px; padding:12px 16px;">
            <i class="fas fa-sign-out-alt" style="font-size:18px;"></i>
            <span>Logout</span>
        </a>

        <div class="user-profile-btn">
            <div class="user-avatar">A</div>
            <div class="user-info">
                <span class="user-name">Admin Profile</span>
                <span class="user-role">Administrator</span>
            </div>
        </div>
    </div>
</aside>

<div id="content-area" class="content-area" style="margin-top:0;"></div>

<script>
    // ===== THEME (SIDEBAR ONLY) =====
    const themeBtn = document.getElementById('theme-toggle-btn');
    const themeLabel = document.getElementById('theme-label');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(dark) {
        document.body.classList.toggle('dark-mode', dark);
        if (themeLabel) themeLabel.textContent = dark ? 'Light Mode' : 'Dark Mode';
        if (themeIcon) themeIcon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
    }

    applyTheme(localStorage.getItem('theme') === 'dark');

    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const isDark = !document.body.classList.contains('dark-mode');
            applyTheme(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }


function loadPage(page) {
    fetch(page)
        .then(response => response.text())
        .then(data => {
            document.getElementById("content-area").innerHTML = data;
        })
        .catch(error => {
            console.error("Error loading page:", error);
        });
}
</script>
</body>
</html>
